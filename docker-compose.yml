services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    hostname: sqlserver
    user: "0:0"
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Base@Prog26"
      MSSQL_PID: "Developer"
    volumes:
      - ./datos_sql:/var/opt/mssql
